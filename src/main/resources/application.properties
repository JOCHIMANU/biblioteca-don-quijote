spring.application.name=biblioteca-don-quijote

# Base de datos. Por defecto: H2 en modo archivo (persistente, se guarda en ./data).
# En la nube se cambia SOLO con variables de entorno (sin tocar este archivo), por ejemplo para PostgreSQL:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://host/basededatos?sslmode=require
#   SPRING_DATASOURCE_USERNAME=usuario
#   SPRING_DATASOURCE_PASSWORD=clave
spring.datasource.url=jdbc:h2:file:./data/biblioteca
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=${DB_POOL:5}
spring.datasource.hikari.minimum-idle=1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false
# Archivos estáticos con la huella de su contenido en el nombre (/js/biblioteca-ab12cd.js): se guardan un año en el
# navegador y, cuando cambian, el nombre cambia solo; nadie ve páginas nuevas con scripts o estilos viejos.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.locale=es
# El puerto lo fija el proveedor de la nube con PORT; en tu equipo sigue siendo el 8080
server.port=${PORT:8080}
# Detrás del proxy de la nube: respeta X-Forwarded-For/Proto (dirección real del visitante y https)
server.forward-headers-strategy=native
# La sesión solo por cookie (sin ;jsessionid en las direcciones), no legible por scripts y no enviada desde otros sitios
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# En la nube (https) se pone COOKIE_SEGURA=true; en tu equipo (http) debe seguir en false o no se podría entrar
server.servlet.session.cookie.secure=${COOKIE_SEGURA:false}
server.servlet.session.timeout=8h

# Entrada con usuario y contraseña. La clave NO se escribe aquí: variable de entorno BIBLIOTECA_CLAVE
# (o config/application.properties, que git ignora). Sin clave se genera una al azar y se anota en el registro.
biblioteca.seguridad.usuario=${BIBLIOTECA_USUARIO:admin}
biblioteca.seguridad.clave=${BIBLIOTECA_CLAVE:}
biblioteca.seguridad.max-intentos=5
biblioteca.seguridad.minutos-bloqueo=15

# Punto de control de salud para el proveedor de la nube (no muestra detalles)
management.endpoints.web.exposure.include=health

# Consulta de DNI en Decolecta. El token NO se escribe aquí: se toma de la variable de entorno
# DECOLECTA_TOKEN (o de config/application.properties, que git ignora).
decolecta.token=${DECOLECTA_TOKEN:}
spring.http.client.connect-timeout=4s
spring.http.client.read-timeout=8s

# Con la base vacía, carga 15 libros de caballerías, 5 lectores y algunos préstamos de ejemplo.
# Ponlo en false (DATOS_EJEMPLO=false) para empezar con la biblioteca en blanco.
biblioteca.datos-ejemplo=${DATOS_EJEMPLO:true}

# Reglas de la casa: SOLO valores iniciales. Una vez guardados en «VII. Configuración» mandan los de la base de datos.
biblioteca.plazo-dias=7
biblioteca.multa-por-dia=1
# 0 = sin límite de libros por lector
biblioteca.max-libros-por-lector=0
biblioteca.bloquear-morosos=false
# Tarea periódica de la paloma mensajera (una vez al día, a las 8 de la mañana)
biblioteca.cron-palomas=0 0 8 * * *
