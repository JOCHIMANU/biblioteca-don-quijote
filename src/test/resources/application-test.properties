spring.datasource.url=jdbc:h2:mem:pruebas;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
# Las pruebas fijan el plazo y la multa para no depender del archivo de producción
biblioteca.plazo-dias=7
biblioteca.multa-por-dia=1
# Clave de prueba (no es la de ningún despliegue real)
biblioteca.seguridad.clave=clave-de-prueba-123
